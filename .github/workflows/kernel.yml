name: Kernel matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: [v5.15, v6.1, v6.6, v6.8]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 virtme-ng
      - run: vng -v -r ${{ matrix.kernel }} -- bundle exec rake compile test:system
